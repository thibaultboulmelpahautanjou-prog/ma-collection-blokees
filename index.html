<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma collection Blokees Transformers</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#10111b;color:#f3f2ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#16172a,#35205d);padding:30px max(18px,calc((100vw - 1150px)/2))}h1{margin:0;font-size:clamp(26px,4vw,40px)}header p{color:#d6cbea}main{max-width:1150px;margin:auto;padding:22px 16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #49455f;background:#232438;color:#fff}input[type=search]{flex:1;min-width:230px}button{cursor:pointer}button:hover,.active{background:#7147b7}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad90ed}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px}.tabs button{white-space:nowrap}.stats{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:18px;color:#d6cbea}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}.card{background:#1c1e30;border:1px solid #37364f;border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:10px}.photo{height:190px;background:radial-gradient(circle at center,#403261,#191929);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{font-size:52px;color:#9a87c6}.small{font-size:12px;color:#c4bdd5}.card h3{margin:0;font-size:18px}.price{font-size:20px;font-weight:700}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{color:#e2c8ff;text-decoration:underline;font-size:13px}.state{width:100%}.note{background:#28243b;border-left:4px solid #9e78e4;padding:12px 16px;margin:15px 0 22px;border-radius:5px}footer{padding:25px;text-align:center;color:#b3a9c4}.pill{border:1px solid #66517f;border-radius:50px;padding:3px 9px;font-size:11px;color:#e5d5ff}a{color:#dfc4ff}

:root{--violet:#ad85ff;--panel:#1a1b2c}body{background:linear-gradient(180deg,#10101b,#141325 45%,#10111b)}header{position:relative;overflow:hidden;border-bottom:1px solid #5b3a92}header:after{content:"";position:absolute;right:4%;top:-95px;width:330px;height:330px;border:2px solid #9d65f0;border-radius:50%;opacity:.12;box-shadow:0 0 0 55px #5d3a88,0 0 0 110px #302046;pointer-events:none}h1{letter-spacing:.03em}.card{transition:transform .18s,border-color .18s;box-shadow:0 8px 24px #0003}.card:hover{transform:translateY(-3px);border-color:#9464d9}.photo{height:235px;background:linear-gradient(145deg,#32284d,#151623)}.placeholder{font-size:14px;text-align:center;line-height:1.6;padding:16px}.hero-tag{display:inline-block;color:#d4bbff;letter-spacing:.13em;font-size:11px;font-weight:800;margin-bottom:8px}.toolbar{position:sticky;top:0;background:#141323ed;backdrop-filter:blur(12px);padding:10px 0;z-index:10}.photo-link{display:block;color:#d6c3fa;font-size:12px;text-align:center}.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.quick button{padding:7px 10px;font-size:12px}.quick button.chosen{background:#6943ac;border-color:#bb91ff}.card .meta{display:flex;align-items:center;justify-content:space-between;gap:5px}.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.notice{line-height:1.5}.price{color:#f4eaff}.card .small{line-height:1.4}.helper{font-size:12px;color:#b7accd}button{transition:background .15s}#updated{color:#c9bbd9;font-size:12px}
</style></head><body><header><span class="hero-tag">INVENTAIRE DU COLLECTIONNEUR · ÉDITION 2</span><h1>TRANSFORMERS <span style="color:#bb9aff">BLOKEES</span></h1><p>Mon catalogue personnel · Recherche, collections et inventaire sauvegardé</p></header><main><div class="stats" id="stats"></div><div id="updated"></div><div class="toolbar"><input type="search" id="search" placeholder="Rechercher Megatron, Classic 20, référence…" aria-label="Rechercher"><select id="filter" aria-label="Filtrer"><option value="all">Toutes les figurines</option><option value="owned">Possédées</option><option value="ordered">Commandées</option><option value="wanted">À acheter</option><option value="missing">Non possédées</option></select><button id="export">Exporter mes cases</button><button id="import">Importer mes cases</button><input type="file" id="file" accept="application/json" hidden></div><nav class="tabs" id="tabs" aria-label="Gammes"></nav><div class="note" id="notice"></div><div id="count" class="small" style="margin-bottom:14px"></div><div class="cards" id="cards"></div></main><footer>Catalogue privé de collection · Données commerciales à confirmer avant achat</footer><script>
let catalog=[],tab='Toutes',statuses={};const KEY='blokees-collection-v1';try{statuses=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const $=id=>document.getElementById(id);const IMGKEY='blokees-photo-overrides-v2';let photos={};try{photos=JSON.parse(localStorage.getItem(IMGKEY)||'{}')}catch{};const photoFor=p=>photos[p.id]||p.image||'';const save=()=>localStorage.setItem(KEY,JSON.stringify(statuses));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let items=catalog.filter(p=>(tab==='Toutes'||(tab==='Nouveautés'&&p.new)||(tab==='Promotions'&&p.promo)||p.series===tab)&&(`${p.name} ${p.series} ${p.seriesNumber} ${p.sku||''}`).toLowerCase().includes($('search').value.toLowerCase())&&($('filter').value==='all'||($('filter').value==='missing'?statuses[p.id]!=='owned':statuses[p.id]===$('filter').value)));
$('stats').innerHTML=`<span><b>${catalog.length}</b> fiches de départ</span><span>✓ ${Object.values(statuses).filter(x=>x==='owned').length} possédées</span><span>📦 ${Object.values(statuses).filter(x=>x==='ordered').length} commandées</span><span>♡ ${Object.values(statuses).filter(x=>x==='wanted').length} à acheter</span>`;
$('count').textContent=`${items.length} résultat(s)`;$('cards').replaceChildren();items.forEach(p=>{let el=document.createElement('article');el.className='card';let image=photoFor(p)?`<img src="${esc(photoFor(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('Photo indisponible'))">`:'<div class="placeholder" aria-label="Photo à ajouter">PHOTO À AJOUTER<br><span class="helper">Aucune image vérifiée</span></div>'; let links=`<a href="${esc(p.productUrl||'https://transforverse.eu/collections/blokees')}" target="_blank" rel="noopener noreferrer">${p.productUrl?'Fiche Transforverse':'Chercher sur Transforverse'} ↗</a>`;if(p.alternateUrl)links+=`<a href="${esc(p.alternateUrl)}" target="_blank" rel="noopener noreferrer">Autre boutique ↗</a>`;el.innerHTML=`<div class="photo">${image}</div><div class="meta"><span class="small">#${esc(p.seriesNumber)}</span><span class="pill">${esc(p.series)}</span></div><div class="small">${esc(p.series)} · ${esc(p.seriesNumber)} ${p.new?'<span class="pill">Nouveauté à confirmer</span>':''}</div><h3>${esc(p.name)}</h3><div class="small">Référence fabricant : ${esc(p.sku||'Non vérifiée')}</div><div class="price">${p.price!=null?Number(p.price).toFixed(2).replace('.',',')+' €':'Prix actuel à vérifier'}</div><div class="small">${p.previousObservedPrice!=null?'Ancien relevé indicatif : '+Number(p.previousObservedPrice).toFixed(2).replace('.',',')+' € · ':''}${esc(p.availability)} · ${p.priceCheckedAt?'Vérifié '+esc(p.priceCheckedAt):'Non vérifié en direct'}</div><div class="links">${links}</div><div class="quick"><button type="button" class="photo-edit" aria-label="Ajouter la photo">📷 Ajouter photo</button><a class="photo-link" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent('Blokees Transformers '+p.series+' '+p.seriesNumber+' '+p.name)}" target="_blank" rel="noopener noreferrer">Rechercher la photo ↗</a></div><label class="small" for="state-${esc(p.id)}">Mon suivi</label><select class="state" id="state-${esc(p.id)}"><option value="">Non classée</option><option value="owned">✓ Je possède</option><option value="ordered">📦 Commandée</option><option value="wanted">♡ À acheter</option></select>`;el.querySelector('.photo-edit').onclick=()=>{let value=prompt('Colle ici le lien DIRECT de la photo de '+p.name+' (adresse https:// se terminant généralement par .jpg, .png ou .webp).',photoFor(p));if(value===null)return;value=value.trim();if(value&&!/^https:\/\//i.test(value)){alert('Le lien doit commencer par https://');return}if(value)photos[p.id]=value;else delete photos[p.id];localStorage.setItem(IMGKEY,JSON.stringify(photos));render()};let sel=el.querySelector('select');sel.value=statuses[p.id]||'';sel.onchange=()=>{if(sel.value)statuses[p.id]=sel.value;else delete statuses[p.id];save();render()};$('cards').append(el)})}
function tabs(){let t=['Toutes','Classic Class','Galaxy Version','Galaxy Defender','Shining Version','Action Edition','Éditions spéciales','Nouveautés','Promotions'];$('tabs').replaceChildren();t.forEach(name=>{let b=document.createElement('button');b.textContent=name;b.className=tab===name?'active':'';b.onclick=()=>{tab=name;tabs();render()};$('tabs').append(b)})}
$('search').oninput=render;$('filter').onchange=render;
$('export').onclick=()=>{let b=new Blob([JSON.stringify({format:'blokees-collection-v1',exportedAt:new Date().toISOString(),statuses},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ma-collection-blokees.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.statuses||typeof d.statuses!=='object'||Array.isArray(d.statuses))throw Error('Format incorrect');if(!confirm('Remplacer tes cases sauvegardées par ce fichier ?'))return;statuses=Object.fromEntries(Object.entries(d.statuses).filter(([k,v])=>typeof k==='string'&&['owned','ordered','wanted'].includes(v)));save();render()}catch(err){alert('Import impossible : '+err.message)}e.target.value=''};
fetch('./catalogue.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fichier catalogue introuvable');return r.json()}).then(d=>{catalog=d.items;$('updated').textContent='Catalogue de base : '+(d.updatedAt||'date non renseignée')+' · Photos personnalisées enregistrées sur cet appareil';$('notice').textContent=d.notice+' Les photos vérifiées ne sont pas encore intégrées : tu peux ajouter le lien d’une image sur chaque fiche avec le bouton 📷. Ces images personnelles restent enregistrées sur cet appareil. Une intégration automatique des photos officielles nécessitera des sources contrôlées. La sauvegarde locale fonctionne dans ce navigateur uniquement. Pour retrouver tes cases ailleurs, exporte puis importe ton inventaire.';tabs();render()}).catch(e=>$('notice').textContent='Erreur de chargement : '+e.message+'. Publie index.html et catalogue.json ensemble sur GitHub Pages.');
</script></body></html>

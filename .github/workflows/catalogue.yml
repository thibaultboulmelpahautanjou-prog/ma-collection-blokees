
name: Actualiser le catalogue Blokees

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write

concurrency:
  group: actualisation-catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rechercher les nouveautes, prix et promotions
        run: python scripts/update_catalogue.py

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique du catalogue Blokees"
            git push
          fi

name: Actualiser les photos Blokees
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Associer les photos officielles des fiches
        run: python scripts/update_photos.py
      - name: Enregistrer les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser les photos Blokees'
            git push
          fi
